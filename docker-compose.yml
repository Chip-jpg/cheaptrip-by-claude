version: "3.9"

services:
  engine:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "main.py", "status"]
      interval: 5m
      timeout: 10s
      retries: 3
